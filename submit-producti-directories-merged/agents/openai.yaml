interface:
  display_name: "外链自动提交合并版"
  short_description: "受控执行目录投递与官方 Contact 邮件申请"
  default_prompt: >
    Use $submit-producti-directories-merged to process this authorized brand-exposure/directory list with transient-result
    capture and resumable records. Before starting: (1) read this skill's SKILL.md and
    SKILL-LOCAL-IMPROVEMENTS.md fully and apply them; (2) confirm the workflow with the user
    (internal materials, technical path, permissions/authorizations, site list) and ask whether to
    drive automation with CDP or Computer Use; (3) apply the operating rules, including: per-site
    brand-exposure identification (business channel first, profile/listing, free ad, press
    release, and project/showcase entries that display the brand homepage — do not skip them;
    identify but do not execute short Note/status or Post/Article editors; when the current batch explicitly authorizes it, include one-to-one official Contact email outreach from the verified signed-in Gmail alias), do not stop at paid/partner paths (finish homepage-visible entry + redirect
    verification), close unrelated leftover tabs before opening a new batch and do not occupy necessary tabs (e.g. Gmail) in mailbox steps, except for an authorized official Contact email lane using the verified alias, re-read React/controlled fields after filling and fail-fast on the first explicit error receipt, run on-site dedup as a HARD GATE BEFORE any form filling — run the four on-site query types (search by the brand domain's MAIN WORD such as 'heydream', NOT the full URL / backend / recent-lists / reachable routes), open-verify each hit, homepage timeout does NOT waive preflight, submit-time 'URL already exists' is not the dedup mechanism, and re-run full dedup on deep-link retry (if the product is already findable on-site, record duplicate and skip; match order-insensitively — a hit on the canonical URL or normalized brand tokens counts as listed, different title word order is NOT a basis for 'not found'), classify free tiers correctly — if a Free $0 plan exists and submission works, record submitted/awaiting approval (note terms risk like backlink maintenance as a later condition, NOT paid-only; terms risk is not a basis for 'no free path'), identify required fields and the wizard flow, fill centrally and submit once, wait for async media-upload unlock (do not click Next before the backend completes) and hand over slow uploads to the human, run the whole batch continuously with NO staged interim reports (deliver one unified per-site report only after every site is attempted, blocked tabs are preserved, and the record audit is done), pass the EXEC-CHECKLIST.md per site before submitting and after judging (record PASS/FAIL), never modify the fingerprint browser server's master client (BitBrowser manager console); the ONLY exception is re-opening/restarting a crashed browser profile in the client to restore the environment — after context compression, re-identification is read-only (profile/CDP port, business tabs only) and any necessary action requires prior user authorization, low-risk verification
    attempted automatically (2/1 attempts, strong anti-automation deferred to human), and report
    every site individually at wrap-up.
