name: Shipmore agent-browser

on:
  pull_request:
    paths:
      - "submit-product-directories-shipmore/**"
      - ".github/workflows/shipmore-agent-browser.yml"
  push:
    branches: [main]
    paths:
      - "submit-product-directories-shipmore/**"
      - ".github/workflows/shipmore-agent-browser.yml"

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest submit-product-directories-shipmore/tests -q
        env:
          RUN_AGENT_BROWSER_E2E: "0"

  agent-browser-e2e-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install pytest
      - run: npm install -g agent-browser@0.38.1
      - run: agent-browser install --with-deps
      - run: agent-browser doctor --offline --quick --json
      - run: python -m pytest submit-product-directories-shipmore/tests/test_agent_browser_e2e.py -q
        env:
          RUN_AGENT_BROWSER_E2E: "1"
          AGENT_BROWSER_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
          AGENT_BROWSER_STATE_EXPIRE_DAYS: "1"

  agent-browser-e2e-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install pytest
      - run: npm install -g agent-browser@0.38.1
      - run: agent-browser install
      - run: agent-browser doctor --offline --quick --json
      - run: python -m pytest submit-product-directories-shipmore/tests/test_agent_browser_e2e.py -q
        env:
          RUN_AGENT_BROWSER_E2E: "1"
          AGENT_BROWSER_ENCRYPTION_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
          AGENT_BROWSER_STATE_EXPIRE_DAYS: "1"
